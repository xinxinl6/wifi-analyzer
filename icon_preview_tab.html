<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Tab 图标预览 - 毛玻璃浮岛风格</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e0e7ff 0%, #f0f9ff 50%, #fce7f3 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
    padding: 40px 20px;
    gap: 40px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #1e293b;
    letter-spacing: -0.5px;
  }

  /* ====== 模拟手机屏幕 ====== */
  .phone-mockup {
    width: 375px;
    background: linear-gradient(180deg, #dbeafe 0%, #f0f9ff 100%);
    border-radius: 44px;
    box-shadow: 0 32px 64px rgba(0,0,0,0.18), 0 0 0 10px #1e293b;
    padding: 48px 0 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    position: relative;
    overflow: hidden;
  }

  .phone-content {
    width: 100%;
    height: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
  }

  .content-title {
    font-size: 26px;
    font-weight: 800;
    color: #1e293b;
    letter-spacing: -1px;
  }
  .content-sub {
    font-size: 14px;
    color: #64748b;
  }

  /* ====== 浮岛 Tab 栏 ====== */
  .tab-bar {
    width: 88%;
    height: 76px;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 8px;
    margin-top: 16px;
  }

  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .icon-wrap {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(148,163,184,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .icon-wrap img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    filter: grayscale(1) opacity(0.55);
    transition: filter 0.22s ease;
  }

  .tab-label {
    font-size: 10px;
    color: #94a3b8;
    font-weight: 500;
    transition: color 0.18s ease;
    letter-spacing: 0.2px;
  }

  /* 激活态 */
  .tab-item.active .icon-wrap {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: #007AFF;
    box-shadow: 0 4px 16px rgba(0,122,255,0.38);
  }

  .tab-item.active .icon-wrap img {
    filter: grayscale(0) brightness(0) invert(1) opacity(1);
    width: 24px;
    height: 24px;
  }

  .tab-item.active .tab-label {
    color: #007AFF;
    font-weight: 700;
  }

  /* ====== 独立图标对比区 ====== */
  .compare-section {
    background: white;
    border-radius: 24px;
    padding: 28px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    width: 420px;
  }

  .compare-title {
    font-size: 14px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }

  .icon-grid {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .icon-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .icon-bg-blue {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: #007AFF;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,122,255,0.3);
  }

  .icon-bg-gray {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-bg-blue img { width: 28px; height: 28px; filter: brightness(0) invert(1); }
  .icon-bg-gray img { width: 24px; height: 24px; filter: none; }

  .icon-name {
    font-size: 11px;
    color: #64748b;
    font-weight: 500;
  }

  .size-label {
    font-size: 10px;
    color: #cbd5e1;
  }

  /* 原始尺寸 */
  .raw-section {
    background: #0f172a;
    border-radius: 16px;
    padding: 20px 28px;
    width: 420px;
  }
  .raw-title { font-size: 13px; color: #64748b; margin-bottom: 16px; }
  .raw-icons { display: flex; gap: 16px; justify-content: center; align-items: center; }
  .raw-icons img { width: 96px; height: 96px; }
</style>
</head>
<body>

<h1>Tab 导航图标 · 毛玻璃浮岛风格</h1>

<!-- 手机模拟 -->
<div class="phone-mockup">
  <div class="phone-content">
    <div class="content-title">WiFi Analyzer</div>
    <div class="content-sub">选择不同 Tab 查看激活效果</div>
  </div>
  <div class="tab-bar" id="tabBar">
    <div class="tab-item active" onclick="activate(0)">
      <div class="icon-wrap">
        <img src="entry/src/main/resources/base/media/ic_home.png" alt="首页">
      </div>
      <span class="tab-label">首页</span>
    </div>
    <div class="tab-item" onclick="activate(1)">
      <div class="icon-wrap">
        <img src="entry/src/main/resources/base/media/ic_wifi.png" alt="WiFi">
      </div>
      <span class="tab-label">WiFi</span>
    </div>
    <div class="tab-item" onclick="activate(2)">
      <div class="icon-wrap">
        <img src="entry/src/main/resources/base/media/ic_chart.png" alt="信道">
      </div>
      <span class="tab-label">信道</span>
    </div>
    <div class="tab-item" onclick="activate(3)">
      <div class="icon-wrap">
        <img src="entry/src/main/resources/base/media/ic_speed.png" alt="测速">
      </div>
      <span class="tab-label">测速</span>
    </div>
    <div class="tab-item" onclick="activate(4)">
      <div class="icon-wrap">
        <img src="entry/src/main/resources/base/media/ic_tool.png" alt="工具">
      </div>
      <span class="tab-label">工具</span>
    </div>
  </div>
</div>

<!-- 图标对比 -->
<div class="compare-section">
  <div class="compare-title">激活态（蓝色背景 · 白色图标）vs 默认态</div>
  <div class="icon-grid">
    <div class="icon-cell">
      <div class="icon-bg-blue"><img src="entry/src/main/resources/base/media/ic_home.png"></div>
      <div class="icon-bg-gray"><img src="entry/src/main/resources/base/media/ic_home.png"></div>
      <div class="icon-name">首页</div>
    </div>
    <div class="icon-cell">
      <div class="icon-bg-blue"><img src="entry/src/main/resources/base/media/ic_wifi.png"></div>
      <div class="icon-bg-gray"><img src="entry/src/main/resources/base/media/ic_wifi.png"></div>
      <div class="icon-name">WiFi</div>
    </div>
    <div class="icon-cell">
      <div class="icon-bg-blue"><img src="entry/src/main/resources/base/media/ic_chart.png"></div>
      <div class="icon-bg-gray"><img src="entry/src/main/resources/base/media/ic_chart.png"></div>
      <div class="icon-name">信道</div>
    </div>
    <div class="icon-cell">
      <div class="icon-bg-blue"><img src="entry/src/main/resources/base/media/ic_speed.png"></div>
      <div class="icon-bg-gray"><img src="entry/src/main/resources/base/media/ic_speed.png"></div>
      <div class="icon-name">测速</div>
    </div>
    <div class="icon-cell">
      <div class="icon-bg-blue"><img src="entry/src/main/resources/base/media/ic_tool.png"></div>
      <div class="icon-bg-gray"><img src="entry/src/main/resources/base/media/ic_tool.png"></div>
      <div class="icon-name">工具</div>
    </div>
  </div>
</div>

<!-- 原始尺寸 -->
<div class="raw-section">
  <div class="raw-title">原始 96×96px 源图（透明背景）</div>
  <div class="raw-icons">
    <img src="entry/src/main/resources/base/media/ic_home.png">
    <img src="entry/src/main/resources/base/media/ic_wifi.png">
    <img src="entry/src/main/resources/base/media/ic_chart.png">
    <img src="entry/src/main/resources/base/media/ic_speed.png">
    <img src="entry/src/main/resources/base/media/ic_tool.png">
  </div>
</div>

<script>
function activate(idx) {
  document.querySelectorAll('.tab-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
}
</script>
</body>
</html>
